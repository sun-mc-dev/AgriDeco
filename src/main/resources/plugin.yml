name: AgriDeco
version: '1.0'
main: me.sunmc.ad.AgriDeco
api-version: '1.21.4'
folia-supported: true

libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.xerial:sqlite-jdbc:3.51.2.0
  - mysql:mysql-connector-java:9.6.0

authors: [ SunMC ]
softdepend: [ AuraSkills, Jobs, GriefPrevention ]
depend: [ packetevents, MMOItems ]

commands:
  agrideco:
    description: "AgriDeco main command."
    aliases: [ deco, agri ]
    usage: "/<command> <reload|give|remove|gui>"
    permission: agrideco.use

permissions:
  agrideco.use:
    default: true
  agrideco.admin:
    default: op