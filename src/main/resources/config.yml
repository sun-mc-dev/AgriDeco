# ─────────────────────────────────────────────────────────────
#  AgriDeco — Main Configuration
#  Plugin by SunMC  |  /agrideco reload to apply most changes
#  Full restart required for structural changes (new defs, etc)
# ─────────────────────────────────────────────────────────────

storage-type: sqlite   # sqlite | mysql

# ─────────────────────────────────────────────────────────────
#  General Settings
# ─────────────────────────────────────────────────────────────
settings:

  armorstands_max_distance: 32
  reload_permission: "agrideco.admin"

  chunk_limit:
    furnitures: 32
    crops: 64

  # ── Player Removal ──────────────────────────────────────────
  # Players remove furniture by left-clicking (attacking) the armor stand.
  removal:
    enabled: true             # Allow players to remove furniture at all
    sneak_required: true      # Must be sneaking to remove (prevents accidents)
    owner_only: true          # Only the owner (or agrideco.admin) can remove
    drop_item: true           # Drop the furniture item back when removed

  # ── Crop Harvesting ─────────────────────────────────────────
  crops:
    owner_only_harvest: false # Globally restrict harvest to the planting player
    # Can also be set per-crop with owner_only_harvest: true

  # ── Placement Cooldown ──────────────────────────────────────
  placement:
    cooldown_seconds: 0       # Seconds between placements per player (0 = disabled)
    # Shared between furniture and crop placements

  # ── Sounds ──────────────────────────────────────────────────
  # Use Bukkit Sound enum names: https://jd.papermc.io/paper/1.21.11/org/bukkit/Sound.html
  sounds:
    place_furniture:
      enabled: true
      sound: "minecraft:block.wood.place"
      volume: 1.0
      pitch: 1.0

    remove_furniture:
      enabled: true
      sound: "minecraft:entity.item.break"
      volume: 1.0
      pitch: 1.2

    plant_crop:
      enabled: true
      sound: "minecraft:block.crop.break"
      volume: 0.8
      pitch: 1.5

    harvest_crop:
      enabled: true
      sound: "minecraft:entity.experience_orb.pickup"
      volume: 1.0
      pitch: 1.0

# ─────────────────────────────────────────────────────────────
#  AuraSkills Integration
# ─────────────────────────────────────────────────────────────
aura_skills:
  skill: "farming"

# ─────────────────────────────────────────────────────────────
#  MySQL (only used when storage-type: mysql)
# ─────────────────────────────────────────────────────────────
database:
  host: "localhost"
  port: 3306
  database: "agrideco"
  username: "root"
  password: "password"
  pool:
    maximum_pool_size: 10
    minimum_idle: 2
    connection_timeout: 30000
    idle_timeout: 600000
    max_lifetime: 1800000

# ─────────────────────────────────────────────────────────────
#  Furniture Definitions
# ─────────────────────────────────────────────────────────────
furniture:

  chair:
    id: "mmoitems:FURNITURE:CHAIR"
    placement_type: "floor"          # floor | wall | ceiling
    furniture_type: "seat"           # decorative | interactable | container | seat | light

    # Only for furniture_type: interactable
    interaction_mmoitem_id: "mmoitems:FURNITURE:CHAIR_OPEN"

    # Only for furniture_type: container
    container:
      title: "<dark_gray>Storage"    # MiniMessage format
      size: 27                       # Multiple of 9

    armorstand:
      offset: "0, 0, 0"
      is_baby: false

    # Only for furniture_type: seat
    seat_offset: "0, 0.3, 0"

    barrier_offsets:
      - "0, 0, 0"

    # ── Per-Item Permission Nodes ────────────────────────────
    # Leave empty ("") to allow anyone with agrideco.use to place/remove.
    place_permission: ""             # e.g. "agrideco.furniture.chair.place"
    remove_permission: ""            # e.g. "agrideco.furniture.chair.remove"

    # Override global settings.removal.drop_item for this specific piece.
    remove_drop_item: true

  wall_lamp:
    id: "mmoitems:FURNITURE:WALL_LAMP"
    placement_type: "wall"
    furniture_type: "interactable"
    interaction_mmoitem_id: "mmoitems:FURNITURE:WALL_LAMP_ON"
    container:
      title: "<dark_gray>Container"
      size: 9
    armorstand:
      offset: "0, 1.2, 0"
      is_baby: true
    seat_offset: "0.5, 0, 0.5"
    barrier_offsets:
      - "0, 0, 0"
    place_permission: ""
    remove_permission: ""
    remove_drop_item: true

# ─────────────────────────────────────────────────────────────
#  Crop Definitions
# ─────────────────────────────────────────────────────────────
crops:

  carrot:
    crop_stage_ids:
      - "mmoitems:INGREDIENTS:CARROT_STAGE_I"
      - "mmoitems:INGREDIENTS:CARROT_STAGE_II"
    seed_id: "mmoitems:INGREDIENTS:CARROT_SEED"
    placement_block_type: "farmland"
    growth_time: 120                  # Ticks between growth checks
    growth_chance: 40                 # % chance to advance per check

    aura_skills:
      experience: 1.4

    jobs:
      job_id: "farming"
      experience: 5.4
      money: 100.4

    armorstand:
      offset: "0, 0.5, 0"
      is_baby: true

    # ── Per-Crop Overrides ───────────────────────────────────
    place_permission: ""              # e.g. "agrideco.crop.carrot.plant"
    owner_only_harvest: false         # Override global crops.owner_only_harvest

  blueberry:
    crop_stage_ids:
      - "mmoitems:INGREDIENTS:BLUEBERRY_STAGE_I"
      - "mmoitems:INGREDIENTS:BLUEBERRY_STAGE_II"
      - "mmoitems:INGREDIENTS:BLUEBERRY_STAGE_III"
    seed_id: "mmoitems:INGREDIENTS:BLUEBERRY_SEED"
    placement_block_type: "grass_block"
    growth_time: 200
    growth_chance: 25
    aura_skills:
      experience: 2.0
    jobs:
      job_id: "farming"
      experience: 8.0
      money: 150.0
    armorstand:
      offset: "0, 0.3, 0"
      is_baby: false
    place_permission: ""
    owner_only_harvest: false