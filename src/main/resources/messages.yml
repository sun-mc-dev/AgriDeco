# ─────────────────────────────────────────────────────────────
#  AgriDeco — Messages  (MiniMessage format)
#  /agrideco reload to apply
# ─────────────────────────────────────────────────────────────
#  Placeholders: {player} {type} {id} {seconds}
# ─────────────────────────────────────────────────────────────

messages:

  # General
  prefix: "<dark_gray>[<green>AgriDeco<dark_gray>] "
  plugin_reload: "<green>Reloaded. <yellow><italic>(Restart for structural changes.)"
  no_permission: "<dark_red>[!] <red>You don't have permission to do that."
  invalid_command: "<dark_red>[!] <red>Usage: /agrideco <gray><reload|give|gui>"
  invalid_configuration: "<dark_red>[!] <red>Configuration error — check the console."

  # Placement
  invalid_placement: "<dark_red>[!] <red>You can't place that here."
  chunk_limit: "<dark_red>[!] <red>This chunk has reached its placement limit."
  placed_furniture: "<green>Furniture placed. <gray>(<yellow>Sneak + left-click<gray> to remove.)"
  placed_crop: "<green>Crop planted."

  # Cooldown
  placement_cooldown: "<yellow>Please wait <gold>{seconds}s <yellow>before placing again."

  # Removal
  removed_furniture: "<green>Furniture removed."
  # Shown when removal requires sneaking and the player isn't sneaking
  sneak_to_remove: "<yellow>Sneak and left-click to remove furniture."
  # Shown when a player tries to remove/harvest something they don't own
  not_owner: "<dark_red>[!] <red>You don't own this."

  # Crops
  harvested_crop: "<green>Crop harvested!"
  crop_not_ready: "<yellow>This crop isn't ready to harvest yet."

  # Give Command
  give_success: "<green>Gave <yellow>{type} <gray>'<yellow>{id}<gray>' <green>to <yellow>{player}<green>."
  give_invalid_id: "<dark_red>[!] <red>No {type} with ID '<yellow>{id}<red>'."
  give_item_error: "<dark_red>[!] <red>Failed to retrieve the MMOItem for this definition."
  player_not_found: "<dark_red>[!] <red>Player not found."

  # Remove Command
  # Placeholders: {type}, {uuid}
  remove_success: "<green>Removed <yellow>{type} <gray><yellow>{uuid}<gray>."
  remove_not_found: "<dark_red>[!] <red>No {type} found with UUID '<yellow>{uuid}<red>'."
  remove_invalid_uuid: "<dark_red>[!] <red>'<yellow>{uuid}<red>' is not a valid UUID."